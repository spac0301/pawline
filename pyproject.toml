[build-system]
requires=["setuptools>=61"]
build-backend="setuptools.build_meta"
[project]
name="pawline"
version="0.2.5"
description="Passive local routing and usage monitor with GTK and Qt companions"
license={file="LICENSE"}
requires-python=">=3.10"
dependencies=["cryptography==50.0.1", "Pillow==12.3.0", "zstandard>=0.23,<1"]
[project.optional-dependencies]
windows=["PySide6_Essentials==6.11.2", "psutil==7.2.2", "pywin32==312; sys_platform == 'win32'"]
[tool.setuptools]
packages=["fluff_monitor"]
